[package]
name = "batch-photo-editor"
version = "0.1.0"
description = "Batch Photo Editor"
edition = "2021"

[[bin]]
name = "batch-photo-editor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
image = "0.25"
